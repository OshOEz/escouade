[package]
name = "escouade-macros"
version = "0.1.0"
description = "The attribute of Escouade's commands: each stays the Tauri command it was and is also an entry of the remote API, called with JSON without Tauri"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"
# A part of the app (docs/CRATES.md): never published.
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
